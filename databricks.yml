# Genie Embed App — Databricks App deployed via DAB (direct engine).
# All settings are bundle variables (override with --var or per target).
bundle:
  name: genie_embed
  engine: direct # deploy without Terraform; valid values: terraform | direct

variables:
  workspace_host:
    description: Workspace host that serves the Genie rooms (no trailing slash).
    default: https://fevm-nfleming-stable-aws.cloud.databricks.com
  workspace_id:
    description: Workspace (org) id appended as the ?o= URL param.
    default: "7474649850651417"
  genie_space_id:
    description: Genie space id — the iframe room (section 1) and the Agent API agent_id (section 2).
    default: "01f153992389158da23cbf54fd8eb89d"
  genie_space_title:
    description: Heading/label shown for the Genie space.
    default: "Sales & Pricing Analytics"

resources:
  apps:
    genie_embed:
      name: genie-embed-${bundle.target}
      description: "Demo app: two ways to surface Ask Genie in a Databricks App"
      source_code_path: ./src
      # User-authorization (OBO) scopes the forwarded token may carry. The Genie
      # Agent API (section 2) requires `genie`; `sql` covers the query execution
      # Genie runs on the viewer's behalf. Adding scopes triggers a re-consent.
      user_api_scopes:
        - genie
        - sql
      config:
        command: ["python", "app.py"]
        env:
          - name: DATABRICKS_WORKSPACE_HOST
            value: ${var.workspace_host}
          - name: WORKSPACE_ID
            value: ${var.workspace_id}
          - name: GENIE_SPACE_ID
            value: ${var.genie_space_id}
          - name: GENIE_SPACE_TITLE
            value: ${var.genie_space_title}

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-nfleming-stable-aws.cloud.databricks.com
